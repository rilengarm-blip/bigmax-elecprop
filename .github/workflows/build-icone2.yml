name: Build APK avec icone v2
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le site
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-*.png www/
      - run: npm install
      - run: npx cap add android
      - name: Icone
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          R = 'android/app/src/main/res'
          a = Image.open('icon-512.png').convert('RGB')
          m = Image.open('icon-maskable-512.png').convert('RGB')
          for d, s, f in [('mdpi', 48, 108), ('hdpi', 72, 162), ('xhdpi', 96, 216), ('xxhdpi', 144, 324), ('xxxhdpi', 192, 432)]:
              a.resize((s, s), Image.LANCZOS).save(R + '/mipmap-' + d + '/ic_launcher.png')
              a.resize((s, s), Image.LANCZOS).save(R + '/mipmap-' + d + '/ic_launcher_round.png')
              m.resize((f, f), Image.LANCZOS).save(R + '/mipmap-' + d + '/ic_launcher_foreground.png')
          print('icones ok')
          PY
      - run: npx cap sync android
      - name: Cle de signature
        run: keytool -genkeypair -keystore bigmax.jks -alias bigmax -keyalg RSA -keysize 2048 -validity 10000 -storepass bigmax2026 -keypass bigmax2026 -dname "CN=Bigmax Elecprop, C=TD"
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/bigmax.jks -Pandroid.injected.signing.store.password=bigmax2026 -Pandroid.injected.signing.key.alias=bigmax -Pandroid.injected.signing.key.password=bigmax2026
      - uses: actions/upload-artifact@v4
        with:
          name: bigmax-elecprop-apk
          path: android/app/build/outputs/apk/release/*.apk
